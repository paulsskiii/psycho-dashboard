[project]
name = "psycho-worker"
version = "0.1.0"
description = "Psycho sync worker: pulls Garmin Connect data, parses FIT files, computes training metrics, writes to Supabase."
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python==1.0.0",
    "garminconnect==0.3.20",
    "garmin-fit-sdk==21.221.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "supabase>=2.34,<3",
    "tenacity>=9.0,<10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["psycho_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines are allowed in data tables; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
